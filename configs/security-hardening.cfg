! ============================================================
! Enterprise Network Security Lab - hardening template
! Adapt interface numbers/VLANs before applying to any device.
! ============================================================

! ----- Access-port anti VLAN-hopping baseline -----
interface range FastEthernet0/10 - 20
 switchport mode access
 switchport nonegotiate

! ----- Port security against unauthorized MAC changes -----
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict

! ----- Edge-port STP protection -----
 spanning-tree portfast
 spanning-tree bpduguard enable
exit

! ----- Example downstream port where a superior BPDU is not allowed -----
! Choose the correct interface for your topology.
interface FastEthernet0/24
 spanning-tree guard root
exit

! ----- Disable Cisco Discovery Protocol when not required -----
no cdp run

! ----- Save after validation -----
! copy running-config startup-config
